<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Cone -->
  <polygon points="32,48 20,64 44,64" fill="#D4A876" stroke="#B8925C" stroke-width="0.5"/>
  <polygon points="32,48 20,64 32,60" fill="#C89A64"/>
  <polygon points="32,48 44,64 32,60" fill="#E8B888"/>

  <!-- Waffle pattern on cone -->
  <g opacity="0.4" stroke="#B8925C" stroke-width="0.5" fill="none">
    <line x1="24" y1="52" x2="40" y2="52"/>
    <line x1="22" y1="55" x2="42" y2="55"/>
    <line x1="21" y1="58" x2="43" y2="58"/>
    <line x1="21" y1="61" x2="43" y2="61"/>
    <line x1="26" y1="48" x2="21" y2="61"/>
    <line x1="32" y1="48" x2="32" y2="64"/>
    <line x1="38" y1="48" x2="43" y2="61"/>
  </g>

  <!-- Ice cream/toppings - layered scoops -->
  <!-- Bottom scoop -->
  <ellipse cx="32" cy="42" rx="16" ry="14" fill="#FF6B9D" opacity="0.95"/>
  <path d="M 20 42 Q 20 32 32 28 Q 44 32 44 42 Z" fill="#FF85B3"/>

  <!-- Middle scoop -->
  <ellipse cx="32" cy="30" rx="14" ry="12" fill="#FFD93D" opacity="0.95"/>
  <path d="M 22 30 Q 22 22 32 19 Q 42 22 42 30 Z" fill="#FFEB6D"/>

  <!-- Top scoop -->
  <ellipse cx="32" cy="20" rx="12" ry="11" fill="#6BCB77" opacity="0.95"/>
  <path d="M 24 20 Q 24 13 32 10 Q 40 13 40 20 Z" fill="#8FE089"/>

  <!-- Sprinkles/garnish -->
  <g stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
    <line x1="16" y1="25" x2="12" y2="15"/>
    <line x1="22" y1="18" x2="18" y2="6"/>
    <line x1="32" y1="12" x2="32" y2="0"/>
    <line x1="42" y1="18" x2="46" y2="6"/>
    <line x1="48" y1="25" x2="52" y2="15"/>
  </g>

  <!-- Highlight for dimension -->
  <ellipse cx="28" cy="22" rx="4" ry="3" fill="white" opacity="0.3"/>
  <ellipse cx="30" cy="35" rx="3" ry="2" fill="white" opacity="0.25"/>
</svg>