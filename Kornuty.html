<script src="data.js"></script>
<script>
// Load image map (id -> image URL/path). Empty values = use SVG illustration fallback.
window.IMAGE_MAP = {};
fetch('images.json')
  .then(r => r.ok ? r.json() : {})
  .then(data => {
    const flat = {};
    Object.entries(data).forEach(([cat, items]) => {
      if (cat.startsWith('_') || typeof items !== 'object') return;
      Object.entries(items).forEach(([id, url]) => {
        if (typeof url === 'string' && url.trim()) flat[id] = url.trim();
      });
    });
    window.IMAGE_MAP = flat;
    window.dispatchEvent(new CustomEvent('imagemap-loaded'));
  })
  .catch(() => {});
</script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="app.jsx"></script>
